<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caminho do Contrato Social</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2efe6;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #2c3e50;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(6, 60px);
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .cell {
      width: 60px;
      height: 60px;
      background: #e0d9c5;
      border: 2px solid #8b7e66;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .player {
      background-color: #2ecc71;
      color: white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #questionBox {
      background: #fff;
      padding: 20px;
      border: 2px solid #ccc;
      max-width: 500px;
      margin: 0 auto 20px;
      display: none;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #2980b9;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #3498db;
    }
  </style>
</head>
<body>
  <h1>Caminho do Contrato Social</h1>
  <div id="board"></div>
  <div id="questionBox">
    <p id="question"></p>
    <div id="answers"></div>
  </div>
  <button onclick="rollDice()">Rolar o Dado</button>

  <script>
    const boardSize = 30;
    let position = 0;

    const questions = [
      {
        q: "Qual é a ideia central de Rousseau sobre o homem em seu estado natural?",
        options: [
          "O homem é um ser racional acima de tudo.",
          "O homem é naturalmente mau.",
          "O homem é bom por natureza, mas corrompido pela sociedade.",
          "O homem é igual em todas as formas de sociedade."
        ],
        answer: 2
      },
      {
        q: "O que Rousseau queria dizer com 'Contrato Social'?",
        options: [
          "Um contrato assinado entre o rei e o povo.",
          "Uma ideia de submissão à vontade alheia.",
          "Um acordo em que os indivíduos abrem mão de parte de sua liberdade para viver em sociedade.",
          "Um pacto econômico para distribuir riquezas."
        ],
        answer: 2
      },
      {
        q: "Qual obra de Rousseau trata da educação?",
        options: [
          "O Príncipe",
          "O Espírito das Leis",
          "Emílio, ou Da Educação",
          "Discurso sobre a Servidão Voluntária"
        ],
        answer: 2
      }
    ];

    const board = document.getElementById("board");
    const questionBox = document.getElementById("questionBox");
    const questionText = document.getElementById("question");
    const answersDiv = document.getElementById("answers");

    function createBoard() {
      board.innerHTML = "";
      for (let i = 0; i < boardSize; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        if (i === position) {
          const player = document.createElement("div");
          player.className = "player";
          player.innerText = "J";
          cell.appendChild(player);
        } else {
          cell.innerText = i + 1;
        }
        board.appendChild(cell);
      }
    }

    function rollDice() {
      const randomQuestion = questions[Math.floor(Math.random() * questions.length)];
      showQuestion(randomQuestion);
    }

    function showQuestion(q) {
      questionBox.style.display = "block";
      questionText.innerText = q.q;
      answersDiv.innerHTML = "";
      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, q.answer);
        answersDiv.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct) {
      questionBox.style.display = "none";
      if (selected === correct) {
        const steps = Math.floor(Math.random() * 3) + 1;
        position += steps;
        if (position >= boardSize) {
          alert("Parabéns! Você completou o Caminho do Contrato Social!");
          position = boardSize - 1;
        } else {
          alert("Resposta correta! Avance " + steps + " casas.");
        }
      } else {
        alert("Resposta errada! Fique parado nessa rodada.");
      }
      createBoard();
    }

    createBoard();
  </script>
</body>
</html>
